name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning. A warning nobody fails on is a warning
  # nobody fixes.
  RUSTFLAGS: -D warnings

concurrency:
  # A new push to a PR makes the previous run pointless, so stop it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel Linux just because Windows broke, or vice versa. When one
      # platform fails we want to see whether the other one did too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The integration tests spawn real shells on real PTYs and bind real
      # ports, so a runaway test must not hang the job for six hours.
      #
      # --no-fail-fast matters more than it looks: without it cargo stops at the
      # first failing test *binary*, which on Windows meant one failure in
      # tests/auth.rs hid the results of pty.rs, ws_bridge.rs and terminals.rs
      # entirely. When a platform breaks we want the whole picture, not the
      # first symptom.
      - name: cargo test
        run: cargo test --all-features --locked --no-fail-fast
        timeout-minutes: 15

  # The Dockerfile is a supported way to run facet, so a change that breaks it
  # should fail here rather than in someone's terminal.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependencies for a program that hands out a shell deserve a look.
  #
  # Suppressions live in .cargo/audit.toml, and each one has to justify itself
  # in writing. Today that is RUSTSEC-2023-0071 (the `rsa` Marvin attack), which
  # is unreachable here because facet only ever signs HS256.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action publishes its findings as a check run, which the default
      # read-only token cannot do.
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
