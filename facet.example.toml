# facet: example configuration.
#
# `facet setup` generates a real facet.toml for you, including the secrets in
# [auth]. This file documents every option; copy it only if you want to write
# the config by hand.
#
# The real facet.toml holds your password hash, TOTP secret and JWT key. It is
# written chmod 600 and is in .gitignore. Do not commit it.

[server]
# Loopback by default. Anything else means the login page is reachable from
# other machines. Read "Exposing it safely" in the README before changing this.
bind = "127.0.0.1"
port = 7443

# Extra origins accepted on the WebSocket upgrade, beyond "same host as the
# request". You only need this if a reverse proxy rewrites the Host header so it
# no longer matches the browser's Origin. Tailscale and Cloudflare Tunnel do not
# need it.
allowed_origins = []

# Append-only JSON-lines audit log: every login (success, failure, throttled) and
# every terminal open/close, with a timestamp and an IP. Comment out to log to
# stdout only.
audit_log = "facet-audit.log"

# Take the client's IP from X-Forwarded-For / X-Real-IP instead of the TCP peer.
#
# Only turn this on when a proxy you control sits in front of facet and
# overwrites the header. Anyone who can reach facet directly can put whatever
# they like in X-Forwarded-For: with this on and no proxy, an attacker gets a
# fresh rate-limit bucket on every request just by changing the header, and the
# audit log faithfully records whatever IP they invented.
#
# With it off (the default) behind a tunnel, every request appears to come from
# 127.0.0.1: rate limiting collapses into a single shared bucket, and the audit
# log records the tunnel rather than the caller. That is the trade, which is why
# this is a decision and not a default.
trust_forwarded_for = false

[shell]
# What to run. The default is platform-specific:
#   Windows   wsl.exe ~ -e bash -l      (a login shell in your WSL home)
#   Unix      $SHELL -l, or /bin/bash
#
# For PowerShell instead of WSL:
#   program = "powershell.exe"
#   args    = ["-NoLogo"]
program = "/bin/bash"
args = ["-l"]

# Working directory for the shell. Omit to start in the user's home directory
# rather than wherever the service happened to be launched from.
# cwd = "/home/you/projects"

# Extra environment variables for the shell. TERM=xterm-256color and
# COLORTERM=truecolor are always set for you.
env = []

[tls]
# On by default. Turning it off is only permitted when bound to loopback. With
# a non-loopback bind, facet refuses to start rather than put your session cookie
# and every keystroke on the wire in the clear.
#
# Behind a tunnel that terminates TLS for you (Cloudflare, Tailscale Serve),
# it is reasonable to set this to false and bind 127.0.0.1.
enabled = true
cert = "certs/cert.pem"
key = "certs/key.pem"

[rate_limit]
# Per-IP throttling on the login endpoint.
#
# This is not the brute-force defence; auth.max_failed_attempts is. This exists
# because verifying a password is *deliberately* expensive (argon2 burns tens of
# milliseconds on purpose), so an unauthenticated flood of login attempts is a
# cheap way to pin a CPU and starve the terminals the machine is there to serve.
# The limiter refuses the flood before it reaches argon2 at all.
#
# Only the login endpoint is throttled. The terminal's own WebSocket traffic is
# not, because throttling it would throttle the thing the program is for.
enabled = true

# Seconds to earn back one attempt.
per_seconds = 2

# How many attempts can be made back to back. Generous enough for a human
# fumbling a TOTP code, useless for a script.
burst = 10

[terminals]
# Cap on concurrent shells, so a runaway client cannot exhaust the machine by
# opening tabs.
max = 10

# Bytes of output kept per terminal and replayed when you reconnect. This is the
# memory cost of "close the laptop and come back": worst case max * this.
scrollback_bytes = 262144

# How long a terminal survives with nothing attached before its shell is killed.
# The whole point is to outlive a dropped connection, so this is generous.
# Set to 0 to keep detached shells forever (they will leak if you forget them).
detached_timeout_minutes = 60

# ---------------------------------------------------------------------------
# [auth]: generated by `facet setup`. Shown here with the secrets removed.
#
# Each secret may instead be supplied by an environment variable, so the file can
# stay out of your dotfiles repo entirely. The environment wins over the file:
#
#   FACET_PASSWORD_HASH   FACET_TOTP_SECRET   FACET_JWT_SECRET
#
# facet will not start without all three. There is no anonymous mode.
# ---------------------------------------------------------------------------
[auth]
# argon2id, PHC format. Carries its own salt and cost parameters.
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$...$..."

# Base32, as authenticator apps expect.
totp_secret = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

# Base64, at least 32 bytes. Signs session cookies; changing it logs you out.
jwt_secret = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# How long a login lasts before you must re-authenticate.
session_ttl_minutes = 720

# Consecutive failures before logins are refused entirely, and for how long.
# The lockout is global, not per-IP. See the threat model in the README.
max_failed_attempts = 5
lockout_minutes = 15
